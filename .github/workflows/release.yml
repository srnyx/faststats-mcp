name: Release

# Runs whenever a GitHub release is published. The release's tag must equal
# "version" in package.json and manifest.json (e.g. 0.2.0, no "v").
on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Check tag matches version
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "${GITHUB_REF_NAME}" != "${version}" ]; then
            echo "::error::Release tag ${GITHUB_REF_NAME} does not match package.json version ${version}"
            exit 1
          fi

      - run: npm run typecheck
      - run: npm test
      - run: npm run pack

      - name: Attach extension to the release
        run: gh release upload "${GITHUB_REF_NAME}" faststats-mcp.mcpb --clobber
        env:
          GH_TOKEN: ${{ github.token }}
